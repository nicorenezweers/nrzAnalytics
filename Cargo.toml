[workspace]
resolver = "2"
members = ["shared", "server", "client", "xtask"]
# Die Weboberflaeche (Dioxus/WASM) ist ein eigener Workspace, wie in nrzForum.
exclude = ["web"]

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "http://100.78.107.162:8390/nicorenezweers/nrzAnalytics"
publish = false

[workspace.dependencies]
nrzanalytics_shared = { path = "shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

# Argon2 und SQLite auch im Debug-Build optimieren (sonst sind Login und Abfragen sehr langsam).
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.libsqlite3-sys]
opt-level = 3
